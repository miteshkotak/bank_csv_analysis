<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Statement Analysis</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (via CDN for local portability) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-6 md:p-10">

    <!-- Header -->
    <header class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                Financial Overview
            </h1>
            <p class="text-slate-400 mt-1">Analysis of outflows and expenses</p>
        </div>
        <div class="text-sm text-slate-500">
            Generated on <span id="gen-date"></span>
        </div>
    </header>

    <!-- KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <!-- Total Outflow -->
        <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
            <div
                class="absolute -right-4 -top-4 w-24 h-24 bg-red-500/10 rounded-full blur-2xl group-hover:bg-red-500/20 transition-colors">
            </div>
            <div class="relative z-10">
                <p class="text-slate-400 text-sm font-medium mb-1">Total Withdrawn</p>
                <h3 class="text-3xl font-bold text-white tracking-tight" id="total-withdrawn">...</h3>
                <div class="w-full bg-slate-800 h-1.5 mt-4 rounded-full overflow-hidden">
                    <div class="h-full bg-red-500 w-full"></div>
                </div>
            </div>
        </div>


        <!-- Top Category -->
        <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
            <div
                class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl group-hover:bg-emerald-500/20 transition-colors">
            </div>
            <div class="relative z-10">
                <p class="text-slate-400 text-sm font-medium mb-1">Top Category</p>
                <h3 class="text-xl font-bold text-white tracking-tight" id="top-category-name">...</h3>
                <p class="text-xs text-emerald-400 mt-1 font-mono" id="top-category-amt">...</p>
            </div>
        </div>

        <!-- Top Vendor -->
        <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
            <div
                class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-500/20 transition-colors">
            </div>
            <div class="relative z-10">
                <p class="text-slate-400 text-sm font-medium mb-1">Top Vendor/Party</p>
                <h3 class="text-xl font-bold text-white tracking-tight" id="top-party-name">...</h3>
                <p class="text-xs text-blue-400 mt-1 font-mono" id="top-party-amt">...</p>
            </div>
        </div>

    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-10">
        <!-- Main Bar Chart -->
        <div class="glass-panel p-6 rounded-2xl">
            <h3 class="text-lg font-semibold mb-6 flex items-center gap-2">
                <span class="w-2 h-6 bg-blue-500 rounded-sm"></span>
                Top Expenses
            </h3>
            <div class="h-64">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Distribution Pie -->
        <div class="glass-panel p-6 rounded-2xl">
            <h3 class="text-lg font-semibold mb-6 flex items-center gap-2">
                <span class="w-2 h-6 bg-purple-500 rounded-sm"></span>
                Distribution
            </h3>
            <div class="h-64 flex justify-center">
                <canvas id="distChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Tables Section -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Category Table -->
        <div class="glass-panel rounded-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-slate-700/50 flex justify-between items-center">
                <h3 class="font-semibold text-lg text-emerald-400">Category Breakdown</h3>
            </div>
            <div class="overflow-x-auto flex-1 h-96">
                <table class="w-full text-left text-sm text-slate-400" id="category-table">
                    <thead class="bg-slate-800/50 text-slate-200 uppercase text-xs sticky top-0 backdrop-blur-md">
                        <tr>
                            <th class="px-6 py-3">Category</th>
                            <th class="px-6 py-3 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/50">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Party Table -->
        <div class="glass-panel rounded-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-slate-700/50 flex justify-between items-center">
                <h3 class="font-semibold text-lg text-blue-400">Party Breakdown</h3>
            </div>
            <div class="overflow-x-auto flex-1 h-96">
                <table class="w-full text-left text-sm text-slate-400" id="party-table">
                    <thead class="bg-slate-800/50 text-slate-200 uppercase text-xs sticky top-0 backdrop-blur-md">
                        <tr>
                            <th class="px-6 py-3">Party/Merchant</th>
                            <th class="px-6 py-3 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700/50">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Data Injection -->
    <script>
        // Placeholder data - will be replaced by Python script
        const DATA = {{ DATA_JSON }};

        // Helper formatting currency
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(amount);
        };

        // Initialize UI
        document.addEventListener('DOMContentLoaded', () => {
            // Set Date
            document.getElementById('gen-date').textContent = new Date().toLocaleDateString();


            // Totals
            const totalWithdrawn = parseFloat(DATA.totals.withdrawn);
            document.getElementById('total-withdrawn').textContent = formatMoney(totalWithdrawn);

            // Top items
            if (DATA.category_breakdown.length > 0) {
                const topCat = DATA.category_breakdown[0];
                document.getElementById('top-category-name').textContent = topCat.Category;
                document.getElementById('top-category-amt').textContent = formatMoney(topCat.Total);
            }

            if (DATA.party_breakdown.length > 0) {
                const topParty = DATA.party_breakdown[0];
                document.getElementById('top-party-name').textContent = topParty.Party;
                document.getElementById('top-party-amt').textContent = formatMoney(topParty.Total);
            }

            // Render Tables
            const renderTable = (id, data, labelKey, valueKey) => {
                const tbody = document.querySelector(`#${id} tbody`);
                tbody.innerHTML = data.map(row => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="px-6 py-4 font-medium text-slate-200">${row[labelKey]}</td>
                        <td class="px-6 py-4 text-right font-mono text-slate-300">${formatMoney(row[valueKey])}</td>
                    </tr>
                `).join('');
            };

            renderTable('category-table', DATA.category_breakdown, 'Category', 'Total');
            renderTable('party-table', DATA.party_breakdown, 'Party', 'Total');

            // Charts
            // 1. Distribution Pie (Top 5 Categories + Other)
            const topCategories = DATA.category_breakdown.slice(0, 5);
            const otherTotal = DATA.category_breakdown.slice(5).reduce((acc, curr) => acc + curr.Total, 0);

            const labels = topCategories.map(c => c.Category);
            const dataVals = topCategories.map(c => c.Total);
            if (otherTotal > 0) {
                labels.push('Others');
                dataVals.push(otherTotal);
            }

            const ctxDist = document.getElementById('distChart').getContext('2d');
            new Chart(ctxDist, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataVals,
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#cbd5e1'],
                        borderColor: '#1e293b',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#94a3b8' } }
                    }
                }
            });

            // 2. Top Parties Bar Chart
            const topParties = DATA.party_breakdown.slice(0, 7);
            const ctxExp = document.getElementById('expenseChart').getContext('2d');
            new Chart(ctxExp, {
                type: 'bar',
                data: {
                    labels: topParties.map(v => v.Party),
                    datasets: [{
                        label: 'Amount',
                        data: topParties.map(v => v.Total),
                        backgroundColor: '#6366f1',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        });
    </script>
</body>

</html>
